<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link rel="stylesheet" href="contact.css">
</head>
<body>

    <div class="form-container">
        <h1>SUNSON RC JUNIOR HIGH SCHOOL</h1>
        <br>
        <h2>Contact us via email</h2>
        <!-- Web3Forms API endpoint handling the submission -->
        <form id="contactForm" action="https://web3forms.com" method="POST">
            
            <!-- REQUIRED: Replace YOUR_ACCESS_KEY_HERE with your real key -->
            <input type="hidden" name="access_key" value="YOUR_ACCESS_KEY_HERE">
            
            <!-- Optional: HoneyPot anti-spam protection (hidden from users) -->
            <input type="checkbox" name="botcheck" class="hidden-honeypot" style="display: none;">

            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" placeholder="Full Name" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="Email address" required>
            </div>

            <div class="form-group">
                <label for="message">Your Message</label>
                <textarea id="message" name="message" rows="5" placeholder="Type your message here..." required></textarea>
            </div>

            <button type="submit" id="submitBtn">Send Message</button>
            <div id="formResponse" class="response-message"></div>
        </form>
    </div>

    <script src="contact.js"></script>
</body>
</html>
